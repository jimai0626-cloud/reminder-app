name: send-reminder

# cron-job.org が数分おきにこのワークフローを起動する（GitHub自身の定期実行は使わない）。
on:
  workflow_dispatch: {}

# 同時に2つ動いて二重送信しないよう、1つずつ順番に実行する。
concurrency:
  group: send-reminder
  cancel-in-progress: false

permissions:
  contents: write # 送信済みの記録(bot/sent.json)をコミットするために必要

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send due reminders
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 bot/send_reminder.py

      # 送信済みの記録が増えたときだけコミットする。
      # メッセージの [skip ci] は、Vercelが無駄に再デプロイしないための目印。
      - name: Save sent log
        run: |
          git config user.name "reminder-bot"
          git config user.email "reminder-bot@users.noreply.github.com"
          git add bot/sent.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update sent log [skip ci]"
            git pull --rebase
            git push
          fi
